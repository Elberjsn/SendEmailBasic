spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: SendEmailApp
  mail:
    host: ${HOST_MAIL}
    port: ${PORT_MAIL:465}
    username: ${USER_MAIL}
    password: ${PASSWORD_MAIL}
    default-encoding: UTF-8
    test-connection: false
    protocol: ${PROTOCOL_MAIL:smtp}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          trust: "*"
          auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 30000
        writetimeout: 5000
  rabbitmq:
    host: ${HOST_RABBITMQ}
    port: ${PORT_RABBITMQ:5672}
    username: ${USER_RABBITMQ}
    password: ${PASS_RABBITMQ}
queue.name: queue.bemvindo